[package]
name = "golive-helper"
version = "0.1.0"
edition = "2021"
description = "Native golive helper: Windows screen capture -> AV1 -> WebRTC, controlled through the golive signaling backend"

[dependencies]
anyhow = "1"
env_logger = "0.11"
futures-util = "0.3"
glib = "0.18"
gstreamer = "0.22"
gstreamer-sdp = "0.22"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = "0.23"
url = "2"

[profile.release]
opt-level = 2